# Bootstrap for the dev (hub) cluster.
# Installs: ArgoCD, Gitea, cert-manager, cluster secrets.
# cert-manager is required by the Kargo chart's self-signed webhooks.
# Registry, ingress-nginx, kargo, etc. are managed via ArgoCD ApplicationSets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gitops/infrastructure/argocd
  - ../../gitops/infrastructure/gitea
  - ../../gitops/infrastructure/cert-manager
  - cluster-secrets/
