# Bootstrap for the tools cluster.
# Installs Argo CD, Forgejo, and cert-manager before GitOps is available.
# Each one is <module>/envs/tools.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kubernetes/argocd/envs/tools
  - ../../kubernetes/forgejo/envs/tools
  - ../../kubernetes/cert-manager/envs/tools
