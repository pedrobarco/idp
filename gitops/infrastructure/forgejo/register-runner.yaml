apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-register
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-register
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-register
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner-register
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-register
    namespace: forgejo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-runner-register
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: forgejo-runner-register
      restartPolicy: OnFailure
      initContainers:
        - name: wait
          image: rancher/kubectl:v1.35.5
          args:
            - -n
            - $(NAMESPACE)
            - rollout
            - status
            - deployment/forgejo
            - --timeout=300s
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      containers:
        - name: register
          image: rancher/kubectl:v1.35.5
          args:
            - -n
            - $(NAMESPACE)
            - exec
            - deploy/forgejo
            - -c
            - forgejo
            - --
            - forgejo
            - forgejo-cli
            - actions
            - register
            - --secret
            - $(TOKEN)
            - --name
            - idp
            - --labels
            - $(LABELS)
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-actions-runner-token
                  key: token
            - name: LABELS
              valueFrom:
                secretKeyRef:
                  name: forgejo-actions-runner-token
                  key: labels
