apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-actions-runner
  labels:
    app: forgejo-actions-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-actions-runner
  template:
    metadata:
      labels:
        app: forgejo-actions-runner
    spec:
      restartPolicy: Always
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
        - name: runner-config
          configMap:
            name: forgejo-actions-runner-config
        - name: dind-config
          configMap:
            name: forgejo-actions-dind-config
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.2.1
          command:
            - /bin/bash
            - -c
            - |
              while ! (echo >/dev/tcp/127.0.0.1/2376) >/dev/null 2>&1; do
                echo 'waiting for docker daemon...'
                sleep 5
              done
              cp /config/config.yaml /data/config.yml
              cat >> /data/config.yml <<EOF
              server:
                connections:
                  forgejo:
                    url: ${FORGEJO_INSTANCE_URL}
                    uuid: ${FORGEJO_RUNNER_UUID}
                    token: ${FORGEJO_RUNNER_SECRET}
              EOF
              exec /bin/forgejo-runner --config /data/config.yml daemon
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: FORGEJO_RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  name: forgejo-actions-runner-token
                  key: uuid
            - name: FORGEJO_RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-actions-runner-token
                  key: token
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /config
        - name: daemon
          image: docker:28-dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-config
              mountPath: /etc/docker
