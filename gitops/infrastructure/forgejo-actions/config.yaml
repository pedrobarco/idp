log:
  level: info
runner:
  file: .runner
  capacity: 1
  timeout: 1h
  # Job images for runs-on. Setup registers this same list.
  # This image includes Node (actions/checkout) and the Docker client (build.sh).
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"
cache:
  enabled: false
container:
  network: host
  docker_host: tcp://localhost:2376
  privileged: true
  options: >-
    -v /certs/client:/certs/client
    -e DOCKER_HOST=tcp://localhost:2376
    -e DOCKER_TLS_VERIFY=1
    -e DOCKER_CERT_PATH=/certs/client
  valid_volumes:
    - /certs/client
