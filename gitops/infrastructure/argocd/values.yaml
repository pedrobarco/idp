global:
  domain: argocd.idp.localhost
configs:
  cm:
    kustomize.buildOptions: --enable-helm
    timeout.reconciliation: 30s
  params:
    server.insecure: true
  # Credentials must match gitops/infrastructure/gitea admin config.
  repositories:
    gitops:
      url: http://gitea-http.gitea.svc.cluster.local:3000/admin/gitops.git
      type: git
      name: gitops
      username: admin
      password: admin123
server:
  ingress:
    enabled: true
    ingressClassName: nginx
