apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod-2

resources:
  - ../../../../apps/hello-app

patches:
  - target:
      kind: Deployment
      name: hello-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "Hello from prod-2!"
  - target:
      kind: Ingress
      name: hello-app
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: hello-app.prod-2.prod.idp.localhost

labels:
  - pairs:
      app.kubernetes.io/env: prod-2
