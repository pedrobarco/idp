# SQLite and the data volume cannot be shared by two pods.
strategy:
  type: Recreate
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
gitea:
  admin:
    # Forgejo reserves the username admin.
    username: idp
    password: admin123
    email: admin@idp.localhost
  config:
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: https://data.forgejo.org
    database:
      DB_TYPE: sqlite3
    server:
      DOMAIN: forgejo.forgejo.tools.idp.localhost
      ROOT_URL: http://forgejo.forgejo.tools.idp.localhost
      DISABLE_SSH: true
      START_SSH_SERVER: false
      LFS_START_SERVER: false
    indexer:
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false
    packages:
      ENABLED: false
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: forgejo.forgejo.tools.idp.localhost
      paths:
        - path: /
          pathType: Prefix
service:
  http:
    port: 3000
persistence:
  enabled: true
  size: 1Gi
test:
  enabled: false
