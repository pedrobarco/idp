apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

resources:
  - ../../../../infrastructure/forgejo

secretGenerator:
  - name: forgejo-actions-runner-token
    envs:
      - secrets/runner-token.env
    options:
      disableNameSuffixHash: true

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: "17.3.2"
    releaseName: forgejo
    namespace: forgejo
    includeCRDs: true
    valuesFile: values.yaml
