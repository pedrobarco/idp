apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../../../infrastructure/argocd

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.17.1"
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml
