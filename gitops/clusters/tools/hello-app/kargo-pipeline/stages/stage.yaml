apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: hello-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-app
      sources:
        direct: false
        stages:
          - qa
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/gitops.git
        - name: imageRepo
          value: registry-tls-proxy.registry.svc.cluster.local/hello-app
        - name: appName
          value: hello-app-stage-nonprod
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./src
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./src/clusters/nonprod/stage/hello-app
            images:
              - image: ${{ vars.imageRepo }}
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./src
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: ${{ vars.appName }}
                sources:
                  - repoURL: ${{ vars.gitRepo }}
        - uses: argocd-wait
          as: wait
          retry:
            timeout: 10m
          config:
            apps:
              - name: ${{ vars.appName }}
        - uses: http
          as: assert-image
          retry:
            timeout: 10m
          config:
            method: GET
            url: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/${{ vars.appName }}
            insecureSkipTLSVerify: true
            timeout: 20s
            pollInterval: 15s
            headers:
              - name: Authorization
                value: Bearer ${{ secret('application-reader').token }}
            successExpression: >
              response.status == 200 &&
              response.body?.status?.health?.status == "Healthy" &&
              response.body?.status?.sync?.status == "Synced" &&
              "${{ vars.imageRepo }}:${{ imageFrom(vars.imageRepo).Tag }}" in
              response.body?.status?.summary?.images
            failureExpression: >
              response.body?.status?.health?.status == "Degraded" ||
              response.body?.status?.operationState?.phase == "Failed" ||
              response.body?.status?.operationState?.phase == "Error"
