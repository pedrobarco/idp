apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: hello-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-app
      sources:
        direct: false
        stages:
          - qa
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/gitops.git
        - name: imageRepo
          value: registry-tls-proxy.registry.svc.cluster.local/hello-app
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./src
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./src/clusters/nonprod/stage/hello-app
            images:
              - image: localhost:5001/hello-app
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./src
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: hello-app-stage-nonprod
                sources:
                  - repoURL: ${{ vars.gitRepo }}
