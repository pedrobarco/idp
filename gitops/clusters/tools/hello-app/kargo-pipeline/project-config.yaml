apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: hello-app
  namespace: hello-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    # Each later stage waits for its Promote button.
    - stageSelector:
        name: qa
      autoPromotionEnabled: false
    - stageSelector:
        name: stage
      autoPromotionEnabled: false
    - stageSelector:
        name: prod-1
      autoPromotionEnabled: false
    - stageSelector:
        name: prod-2
      autoPromotionEnabled: false
