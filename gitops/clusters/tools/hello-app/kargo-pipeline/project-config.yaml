apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: hello-app
  namespace: hello-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    # qa, stage, and prod wait for a Promote button. prod deploys nothing;
    # prod-1 and prod-2 take that Freight automatically.
    - stageSelector:
        name: qa
      autoPromotionEnabled: false
    - stageSelector:
        name: stage
      autoPromotionEnabled: false
    - stageSelector:
        name: prod
      autoPromotionEnabled: false
    - stageSelector:
        name: prod-1
      autoPromotionEnabled: true
    - stageSelector:
        name: prod-2
      autoPromotionEnabled: true
