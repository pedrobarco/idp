# SQLite and the data volume cannot be shared by two pods.
strategy:
  type: Recreate
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
deployment:
  env:
    - name: GITEA_RUNNER_REGISTRATION_TOKEN
      valueFrom:
        secretKeyRef:
          name: gitea-actions-runner-token
          key: token
gitea:
  admin:
    username: admin
    password: admin123
    email: admin@idp.localhost
  config:
    actions:
      ENABLED: true
    database:
      DB_TYPE: sqlite3
    server:
      DOMAIN: gitea.gitea.tools.idp.localhost
      ROOT_URL: http://gitea.gitea.tools.idp.localhost
      DISABLE_SSH: true
      START_SSH_SERVER: false
      LFS_START_SERVER: false
    indexer:
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false
    packages:
      ENABLED: false
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: gitea.gitea.tools.idp.localhost
      paths:
        - path: /
          pathType: Prefix
service:
  http:
    port: 3000
persistence:
  enabled: true
  size: 1Gi
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
valkey:
  enabled: false
valkey-cluster:
  enabled: false
test:
  enabled: false
