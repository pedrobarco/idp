apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-app
  namespace: hello-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  freightCreationPolicy: Automatic
  interval: 30s
  subscriptions:
    - image:
        repoURL: registry-tls-proxy.registry.svc.cluster.local/hello-app
        insecureSkipTLSVerify: true
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 5
        strictSemvers: false
        allowTags: "^[0-9a-f]{7}$"
