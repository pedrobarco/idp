apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../infrastructure/kargo
  - admin-credentials.yaml

# Keep inflated charts out of the Git checkout Argo CD caches between builds.
helmGlobals:
  chartHome: /tmp/kargo-charts

helmCharts:
  - name: kargo
    repo: oci://ghcr.io/akuity/kargo-charts
    version: "1.10.2"
    releaseName: kargo
    namespace: kargo
    includeCRDs: true
    valuesFile: values.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: idp
    includeSelectors: false
