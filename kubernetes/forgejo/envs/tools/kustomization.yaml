apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

resources:
  - ../../base

components:
  - ../../../forgejo-actions/components/runner-token

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: "17.3.2"
    releaseName: forgejo
    namespace: forgejo
    includeCRDs: true
    valuesFile: values.yaml
