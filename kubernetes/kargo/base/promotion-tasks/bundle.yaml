# Shared by every platform project. The source is
# kubernetes/<project>/envs/<stage> in the platform repo. The stage name is the
# env directory and the cluster. The namespace defaults to the project name.
# A stage overrides namespace when the workload namespace differs, as
# forgejo-actions does. The rendered directory is <cluster>/<namespace>/<project>
# and the Application is <project>-<namespace>-<cluster>.
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: bundle
spec:
  vars:
    - name: platformRepo
      value: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/platform.git
    - name: gitRepo
      value: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/gitops.git
    - name: namespace
      value: ${{ ctx.project }}
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.platformRepo }}
        checkout:
          - commit: ${{ commitFrom(vars.platformRepo).ID }}
            path: ./proposal
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: main
            path: ./gitops
    - uses: delete
      config:
        path: ./gitops/${{ ctx.stage }}/${{ vars.namespace }}/${{ ctx.project }}
    - uses: kustomize-build
      config:
        path: ./proposal/kubernetes/${{ ctx.project }}/envs/${{ ctx.stage }}
        outPath: ./gitops/${{ ctx.stage }}/${{ vars.namespace }}/${{ ctx.project }}/manifests.yaml
    - uses: file-write
      config:
        path: ./gitops/${{ ctx.stage }}/${{ vars.namespace }}/${{ ctx.project }}/kustomization.yaml
        permissions: "0644"
        contents: |
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - manifests.yaml
    - uses: git-commit
      config:
        path: ./gitops
        message: "${{ ctx.stage }}: render ${{ commitFrom(vars.platformRepo).ID }}"
    - uses: git-push
      config:
        path: ./gitops
    - uses: argocd-update
      config:
        apps:
          - name: ${{ ctx.project }}-${{ vars.namespace }}-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitRepo }}
    - uses: argocd-wait
      config:
        apps:
          - name: ${{ ctx.project }}-${{ vars.namespace }}-${{ ctx.stage }}
