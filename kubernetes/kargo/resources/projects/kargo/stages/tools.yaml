apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: tools
  namespace: kargo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: bundle
            kind: ClusterPromotionTask
