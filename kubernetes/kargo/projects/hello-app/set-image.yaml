# hello-app stages that deploy call this task. The stage supplies cluster.
# It checks out hello-app main, sets the freight tag on deploy/envs/<stage>,
# and replaces <cluster>/<stage>/hello-app in gitops. The stage name is the
# workload namespace. Checkout stays on main until hello-app-config exists.
# prod does not call this task: that stage is a gate and writes nothing.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: set-image
  namespace: hello-app
spec:
  vars:
    - name: appRepo
      value: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/hello-app.git
    - name: gitRepo
      value: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/gitops.git
    - name: imageRepo
      value: registry-tls-proxy.registry.svc.cluster.local/hello-app
    - name: cluster
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.appRepo }}
        checkout:
          - branch: main
            path: ./app
    - uses: kustomize-set-image
      as: update-image
      config:
        path: ./app/deploy/envs/${{ ctx.stage }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: main
            path: ./gitops
    - uses: delete
      config:
        path: ./gitops/${{ vars.cluster }}/${{ ctx.stage }}/${{ ctx.project }}
    - uses: kustomize-build
      config:
        path: ./app/deploy/envs/${{ ctx.stage }}
        outPath: ./gitops/${{ vars.cluster }}/${{ ctx.stage }}/${{ ctx.project }}/manifests.yaml
    - uses: file-write
      config:
        path: ./gitops/${{ vars.cluster }}/${{ ctx.stage }}/${{ ctx.project }}/kustomization.yaml
        permissions: "0644"
        contents: |
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - manifests.yaml
    - uses: git-commit
      config:
        path: ./gitops
        message: "${{ ctx.stage }}: ${{ imageFrom(vars.imageRepo).Tag }}"
    - uses: git-push
      config:
        path: ./gitops
    - uses: argocd-update
      config:
        apps:
          - name: ${{ ctx.project }}-${{ ctx.stage }}-${{ vars.cluster }}
            sources:
              - repoURL: ${{ vars.gitRepo }}
    - uses: argocd-wait
      as: wait
      retry:
        timeout: 10m
      config:
        apps:
          - name: ${{ ctx.project }}-${{ ctx.stage }}-${{ vars.cluster }}
    - uses: http
      as: assert-image
      retry:
        timeout: 10m
      config:
        method: GET
        url: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/${{ ctx.project }}-${{ ctx.stage }}-${{ vars.cluster }}
        insecureSkipTLSVerify: true
        timeout: 20s
        pollInterval: 15s
        headers:
          - name: Authorization
            value: Bearer ${{ secret('application-reader').token }}
        successExpression: >
          response.status == 200 &&
          response.body?.status?.health?.status == "Healthy" &&
          response.body?.status?.sync?.status == "Synced" &&
          "${{ vars.imageRepo }}:${{ imageFrom(vars.imageRepo).Tag }}" in
          response.body?.status?.summary?.images
        failureExpression: >
          response.body?.status?.health?.status == "Degraded" ||
          response.body?.status?.operationState?.phase == "Failed" ||
          response.body?.status?.operationState?.phase == "Error"
