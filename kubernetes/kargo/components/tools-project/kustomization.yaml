apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - project-config.yaml

# The Project name is the ProjectConfig name and its namespace.
replacements:
  - source:
      kind: Project
      fieldPath: metadata.name
    targets:
      - select:
          kind: ProjectConfig
        fieldPaths:
          - metadata.name
          - metadata.namespace
        options:
          create: true
