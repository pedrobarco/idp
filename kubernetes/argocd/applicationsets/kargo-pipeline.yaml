apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-pipeline
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/platform.git
        revision: HEAD
        directories:
          - path: "kubernetes/kargo/projects/*"
  template:
    metadata:
      name: "kargo-pipeline-{{ .path.basename }}-tools"
      labels:
        app.kubernetes.io/name: kargo-pipeline
        app.kubernetes.io/part-of: idp
        app.kubernetes.io/cluster: tools
    spec:
      project: default
      source:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/platform.git
        targetRevision: HEAD
        path: "{{ .path.path }}"
      destination:
        name: tools
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
