# Git directory generator: discovers deployment targets from the gitops repo root.
# Path: <cluster>/<namespace>/ingress-nginx
# Add a new directory → ingress-nginx auto-deploys there.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/gitops.git
        revision: HEAD
        directories:
          - path: "tools/*/ingress-nginx"
  template:
    metadata:
      name: "ingress-nginx-{{ index .path.segments 1 }}-{{ index .path.segments 0 }}"
      annotations:
        kargo.akuity.io/authorized-stage: "ingress-nginx:tools"
      labels:
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/part-of: idp
        app.kubernetes.io/cluster: "{{ index .path.segments 0 }}"
    spec:
      project: default
      source:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/gitops.git
        targetRevision: HEAD
        path: "{{ .path.path }}"
      destination:
        name: "{{ index .path.segments 0 }}"
        namespace: "{{ index .path.segments 1 }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
