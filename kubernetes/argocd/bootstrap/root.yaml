# Root Application that tracks kubernetes/argocd/applicationsets on the platform repo.
# Argo CD applies any ApplicationSet dropped in that directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/platform.git
    targetRevision: HEAD
    path: kubernetes/argocd/applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
