# Root Application that tracks kubernetes/argocd/resources/applicationsets.
# gitops.yaml deploys every rendered gitops directory. kargo-projects.yaml
# deploys one Application per Kargo project. kargo-shared-resources.yaml
# deploys resources/shared.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationsets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/idp/platform.git
    targetRevision: HEAD
    path: kubernetes/argocd/resources/applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
