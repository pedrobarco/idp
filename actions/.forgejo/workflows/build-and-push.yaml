name: Build and Push

on:
  workflow_call:
    inputs:
      registry:
        description: "Registry host"
        type: string
        default: "registry-tls-proxy.registry.svc.cluster.local"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout actions repo
        uses: actions/checkout@v4
        with:
          repository: idp/actions
          ref: main
          path: .actions
      - name: Build and push
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          .actions/build.sh \
            --registry "${{ inputs.registry }}" \
            --repo "${REPO_NAME}" \
            --context .
